<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D85A30">
<title>どら山 在庫ダッシュボード</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="在庫">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2a2420; --sub:#8a8178; --line:#e7e0d6;
    --track:#ece6dc; --track-br:#d7cfc2;
    --coral:#d8552c; --green:#5a9a1e; --amber:#dd8a00; --blue:#2f7ed8; --red:#d23b32;
    --coral-bg:#fcebe3; --green-bg:#eef6e2; --amber-bg:#fdf0d8; --blue-bg:#e6effb; --gray-bg:#f1ede6;
    --shadow:0 1px 2px rgba(60,40,20,.06),0 2px 10px rgba(60,40,20,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;padding:0 16px 48px;}
  .wrap{max-width:860px;margin:0 auto}
  header.top{padding:18px 2px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .ttl{font-size:20px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
  .ttl .dot{width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px #fbe4d8}
  .updated{font-size:12px;color:var(--sub)}
  .updated b{color:var(--ink);font-weight:700}

  /* hero cards */
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:6px 0 14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px 11px;
    box-shadow:var(--shadow);cursor:pointer;text-align:left;position:relative;transition:transform .08s,border-color .12s;-webkit-tap-highlight-color:transparent}
  .kpi:active{transform:scale(.98)}
  .kpi.on{border-color:var(--ink)}
  .kpi .n{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .kpi .lb{font-size:12px;font-weight:700;margin-top:6px;color:var(--sub)}
  .kpi .bar{height:4px;border-radius:3px;margin-top:9px;opacity:.9}
  .kpi.c-red .n{color:var(--red)} .kpi.c-red .bar{background:var(--red)}
  .kpi.c-blue .n{color:var(--blue)} .kpi.c-blue .bar{background:var(--blue)}
  .kpi.c-amber .n{color:var(--amber)} .kpi.c-amber .bar{background:var(--amber)}
  .kpi.c-green .n{color:var(--green)} .kpi.c-green .bar{background:var(--green)}

  /* controls */
  .controls{display:flex;gap:8px;align-items:center;margin:4px 0 12px;flex-wrap:wrap}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;font-weight:700;
    padding:7px 13px;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{margin-left:auto;flex:1;min-width:140px;max-width:260px}
  .search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:14px;color:var(--ink);outline:none}
  .search input::placeholder{color:var(--sub)}

  /* rows */
  .list{display:flex;flex-direction:column;gap:9px}
  .grp{font-size:12px;font-weight:800;color:var(--sub);margin:12px 2px 2px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .grp .ln{flex:1;height:1px;background:var(--line)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
  .row.lead-red{border-left:4px solid var(--red)}
  .row.lead-amber{border-left:4px solid var(--amber)}
  .row.lead-blue{border-left:4px solid var(--blue)}
  .row.lead-green{border-left:4px solid var(--green)}
  .name{font-size:15px;font-weight:700;letter-spacing:.01em}
  .meta{font-size:11.5px;color:var(--sub);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tag{background:var(--gray-bg);color:var(--sub);border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
  .exp{border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
  .exp.warn{background:var(--coral-bg);color:var(--coral)}
  .exp.soon{background:var(--amber-bg);color:var(--amber)}

  .barwrap{grid-column:1 / -1;margin-top:9px}
  .track{position:relative;height:22px;background:var(--track);border:1px solid var(--track-br);border-radius:7px;overflow:hidden}
  .fill{position:absolute;top:0;left:0;height:100%;border-radius:6px 0 0 6px}
  .fill.store{z-index:2}
  .fill.ware{z-index:1;background:repeating-linear-gradient(45deg,rgba(120,110,95,.22),rgba(120,110,95,.22) 5px,rgba(120,110,95,.11) 5px,rgba(120,110,95,.11) 10px)}
  .fill.red{background:var(--coral)} .fill.green{background:var(--green)} .fill.amber{background:var(--amber)}
  .minmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);z-index:3}
  .minmark:after{content:"最低";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:9.5px;font-weight:800;color:var(--ink);white-space:nowrap}
  .barnums{display:flex;gap:12px;margin-top:5px;font-size:11.5px;color:var(--sub)}
  .barnums b{color:var(--ink);font-weight:800}

  .note{justify-self:end;text-align:right;min-width:104px}
  .badge{display:inline-block;font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .badge.red{background:var(--coral-bg);color:var(--red)}
  .badge.amber{background:var(--amber-bg);color:var(--amber)}
  .badge.blue{background:var(--blue-bg);color:var(--blue)}
  .badge.green{background:var(--green-bg);color:var(--green)}
  .nsub{font-size:11px;color:var(--sub);margin-top:3px}

  footer{margin-top:22px;text-align:center;color:var(--sub);font-size:12px;line-height:1.7}
  footer a{color:var(--coral);text-decoration:none;font-weight:700}
  .applink{display:inline-block;margin-top:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:9px 18px;box-shadow:var(--shadow);color:var(--ink);font-weight:700;font-size:13px;text-decoration:none}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
  @media (max-width:560px){
    .hero{grid-template-columns:repeat(2,1fr)}
    .kpi .n{font-size:24px}
    .row{grid-template-columns:1fr;gap:3px}
    .note{justify-self:start;text-align:left;margin-top:7px}
    .search{margin-left:0;max-width:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ttl"><span class="dot"></span>どら山 在庫ダッシュボード</div>
    <div class="updated">最終更新 <b id="upd">—</b></div>
  </header>

  <div class="hero" id="hero"></div>

  <div class="controls">
    <div class="chips" id="chips"></div>
    <div class="search"><input id="q" type="search" placeholder="品名でさがす" autocomplete="off"></div>
  </div>

  <div class="list" id="list"></div>

  <footer>
    数字は <b>店舗在庫</b> と <b>最低ライン</b>、斜線は倉庫の予備在庫。到着待ちは発送メールから自動反映。<br>
    <a class="applink" id="applink" href="#">在庫アプリで編集・棚卸する</a>
  </footer>
</div>

<script>
var APP_URL = "https://www.appsheet.com/start/c1321275-432b-435c-a679-4406e892d7a6";
document.getElementById('applink').href = APP_URL;

var STATE = { cat:"すべて", group:null, q:"" };
var DATA = null;

function classify(it){
  // returns {pri, badge, badgeCls, sub, barCls, lead, groupKey}
  var s=it.s, w=it.w, mn=it.min, total=it.total, ship=it.ship;
  var hasW = (w>=0.5);                        // 倉庫に意味のある在庫がある
  var belowShelf = (mn!=null && s<mn);        // 店舗が最低ラインを下回る
  var shortTotal = (mn!=null && total<mn);    // 店舗+倉庫でも最低に届かない→買い足し要
  var barCls = belowShelf ? "red" : "green";
  if(ship){
    return {pri:3, badge:"到着待ち", badgeCls:"blue", sub:(it.eta?("お届け "+it.eta+"頃"):it.ship), lead:"lead-blue", barCls:barCls, groupKey:"到着待ち"};
  }
  if(shortTotal){
    return {pri:0, badge:"発注を検討", badgeCls:"red",
      sub:"在庫 "+fmt(total)+" / 最低 "+fmt(mn)+(hasW?"（倉庫に "+fmt(w)+"）":""),
      lead:"lead-red", barCls:"red", groupKey:"今すぐ発注"};
  }
  if(mn!=null && total===mn){
    return {pri:4, badge:"在庫わずか", badgeCls:"amber", sub:"最低ラインぴったり", lead:"lead-amber", barCls:"amber", groupKey:"在庫わずか"};
  }
  if(belowShelf && hasW){
    return {pri:5, badge:"倉庫から補充", badgeCls:"amber", sub:"倉庫に "+fmt(w)+" あり", lead:"lead-amber", barCls:"red", groupKey:"十分"};
  }
  if(mn==null){
    return {pri:7, badge:"目安なし", badgeCls:"green", sub:"最低在庫 未設定", lead:"lead-green", barCls:"green", groupKey:"十分"};
  }
  return {pri:6, badge:"在庫OK", badgeCls:"green", sub:"", lead:"lead-green", barCls:"green", groupKey:"十分"};
}

function expInfo(it){
  if(!it.exp) return null;
  var d=parseDate(it.exp); if(!d) return null;
  var today=new Date(); today.setHours(0,0,0,0);
  var diff=Math.round((d-today)/86400000);
  if(diff<0) return {cls:"warn", txt:"期限切れ "+md(d)};
  if(diff<=7) return {cls:"soon", txt:"期限 "+md(d)};
  return null;
}
function parseDate(s){
  s=(""+s).trim(); if(!s) return null;
  var m=s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})/);
  if(m){var y=new Date().getFullYear();return new Date(y,+m[1]-1,+m[2]);}
  return null;
}
function md(d){return (d.getMonth()+1)+"/"+d.getDate();}
function fmt(n){ if(n==null) return "—"; n=Math.round(n*10)/10; return (""+n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }

var HERO = [
  {key:"今すぐ発注", cls:"c-red",   lb:"今すぐ発注"},
  {key:"到着待ち",   cls:"c-blue",  lb:"到着待ち"},
  {key:"在庫わずか", cls:"c-amber", lb:"在庫わずか"},
  {key:"十分",       cls:"c-green", lb:"十分"}
];

function render(){
  var items = DATA.items.map(function(it){ var c=classify(it); return {it:it,c:c}; });

  // hero counts
  var counts={}; HERO.forEach(function(h){counts[h.key]=0;});
  items.forEach(function(x){ counts[x.c.groupKey]=(counts[x.c.groupKey]||0)+1; });
  var hero=document.getElementById('hero'); hero.innerHTML="";
  HERO.forEach(function(h){
    var el=document.createElement('button');
    el.className="kpi "+h.cls+(STATE.group===h.key?" on":"");
    el.innerHTML='<div class="n">'+(counts[h.key]||0)+'</div><div class="lb">'+h.lb+'</div><div class="bar"></div>';
    el.onclick=function(){ STATE.group=(STATE.group===h.key?null:h.key); render(); };
    hero.appendChild(el);
  });

  // category chips
  var cats=["すべて"]; DATA.items.forEach(function(it){ if(cats.indexOf(it.cat)<0) cats.push(it.cat); });
  var chips=document.getElementById('chips'); chips.innerHTML="";
  cats.forEach(function(c){
    var el=document.createElement('button');
    el.className="chip"+(STATE.cat===c?" on":"");
    el.textContent=c;
    el.onclick=function(){ STATE.cat=c; render(); };
    chips.appendChild(el);
  });

  // filter
  var q=STATE.q.trim();
  var rows=items.filter(function(x){
    if(STATE.cat!=="すべて" && x.it.cat!==STATE.cat) return false;
    if(STATE.group && x.c.groupKey!==STATE.group) return false;
    if(q && x.it.name.indexOf(q)<0) return false;
    return true;
  });
  // sort by urgency then by shortfall
  rows.sort(function(a,b){
    if(a.c.pri!==b.c.pri) return a.c.pri-b.c.pri;
    var sa=(a.it.min!=null? a.it.s-a.it.min : 999);
    var sb=(b.it.min!=null? b.it.s-b.it.min : 999);
    return sa-sb;
  });

  var list=document.getElementById('list'); list.innerHTML="";
  if(!rows.length){ list.innerHTML='<div class="empty">該当する品目はありません</div>'; return; }

  var lastGrp=null;
  rows.forEach(function(x){
    if(x.c.groupKey!==lastGrp){
      lastGrp=x.c.groupKey;
      var g=document.createElement('div'); g.className="grp";
      g.innerHTML='<span>'+lastGrp+'</span><span class="ln"></span>';
      list.appendChild(g);
    }
    list.appendChild(rowEl(x.it,x.c));
  });
}

function rowEl(it,c){
  var s=it.s, w=it.w, mn=it.min;
  var scale=Math.max(mn||0, s+w, 1)*1.12;
  var storeW=Math.max(0, Math.min(100, s/scale*100));
  var wareW=Math.max(0, Math.min(100-storeW, w/scale*100));
  var minPct=(mn!=null)? Math.max(0, Math.min(100, mn/scale*100)) : null;

  var row=document.createElement('div'); row.className="row "+c.lead;

  var ex=expInfo(it);
  var metaHtml='<span class="tag">'+it.cat+'</span>';
  if(ex) metaHtml+='<span class="exp '+ex.cls+'">'+ex.txt+'</span>';

  var minMarkHtml = (minPct!=null)? '<div class="minmark" style="left:'+minPct+'%"></div>' : '';
  var nsub = c.sub? '<div class="nsub">'+c.sub+'</div>' : '';

  row.innerHTML=
    '<div><div class="name">'+it.name+'</div><div class="meta">'+metaHtml+'</div></div>'+
    '<div class="note"><span class="badge '+c.badgeCls+'">'+c.badge+'</span>'+nsub+'</div>'+
    '<div class="barwrap">'+
      '<div class="track">'+
        '<div class="fill store '+c.barCls+'" style="width:'+storeW+'%"></div>'+
        '<div class="fill ware" style="left:'+storeW+'%;width:'+wareW+'%"></div>'+
        minMarkHtml+
      '</div>'+
      '<div class="barnums"><span>店舗 <b>'+fmt(s)+'</b></span>'+
        (w>0?'<span>倉庫 <b>'+fmt(w)+'</b></span>':'')+
        (mn!=null?'<span>最低 <b>'+fmt(mn)+'</b></span>':'<span>最低 未設定</span>')+'</div>'+
    '</div>';
  return row;
}

function boot(){
  document.getElementById('q').addEventListener('input',function(e){STATE.q=e.target.value;render();});
  fetch('data.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    DATA=d;
    document.getElementById('upd').textContent=d.updated||"";
    render();
  }).catch(function(e){
    document.getElementById('list').innerHTML='<div class="empty">データを読み込めませんでした。<br>時間をおいて再読み込みしてください。</div>';
  });
}
boot();
</script>
</body>
</html>
