<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D85A30">
<title>どら山在庫リスト</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="在庫">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2a2420; --sub:#8a8178; --line:#e7e0d6;
    --track:#ece6dc; --track-br:#d7cfc2;
    --coral:#d8552c; --green:#5a9a1e; --amber:#dd8a00; --blue:#2f7ed8; --red:#d23b32;
    --coral-bg:#fcebe3; --green-bg:#eef6e2; --amber-bg:#fdf0d8; --blue-bg:#e6effb; --gray-bg:#f1ede6;
    --shadow:0 1px 2px rgba(60,40,20,.06),0 2px 10px rgba(60,40,20,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;padding:0 16px calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;}
  .wrap{max-width:860px;margin:0 auto}
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top)}
  .topbar:after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(var(--bg),rgba(250,247,242,0));pointer-events:none}
  header.top{padding:14px 2px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:nowrap}
  .ttl{font-size:20px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:9px;flex:0 1 auto;min-width:0;white-space:nowrap}
  .ttl .dot{width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px #fbe4d8}
  .updated{font-size:11.5px;color:var(--sub);white-space:nowrap;flex:none;text-align:right}
  .updated b{color:var(--ink);font-weight:700}

  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 9px}
  .hero.hide{display:none}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 7px;
    box-shadow:var(--shadow);cursor:pointer;text-align:center;transition:transform .08s,border-color .12s;-webkit-tap-highlight-color:transparent}
  .kpi:active{transform:scale(.98)}
  .kpi.on{border-color:var(--ink)}
  .kpi .n{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .kpi .lb{font-size:10.5px;font-weight:700;margin-top:3px;color:var(--sub);white-space:nowrap}
  .kpi .bar{height:3px;border-radius:3px;margin-top:5px;opacity:.9}
  .kpi.c-red .n{color:var(--red)} .kpi.c-red .bar{background:var(--red)}
  .kpi.c-blue .n{color:var(--blue)} .kpi.c-blue .bar{background:var(--blue)}
  .kpi.c-amber .n{color:var(--amber)} .kpi.c-amber .bar{background:var(--amber)}
  .kpi.c-green .n{color:var(--green)} .kpi.c-green .bar{background:var(--green)}

  .controls{display:flex;gap:8px;align-items:center;margin:2px 0 8px;flex-wrap:wrap}
  .controls.hide{display:none}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chips.hide{display:none}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;font-weight:700;
    padding:7px 13px;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .selwrap{display:flex;align-items:center;gap:6px}
  .selwrap.hide{display:none}
  .selwrap label{font-size:12px;color:var(--sub);font-weight:700}
  select.sel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink);outline:none}
  .search{margin-left:auto;flex:1;min-width:140px;max-width:260px}
  .search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:14px;color:var(--ink);outline:none}
  .search input::placeholder{color:var(--sub)}

  .list{display:flex;flex-direction:column;gap:7px}
  .grp{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 1px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .grp .ln{flex:1;height:1px;background:var(--line)}
  .grp .cnt{color:var(--ink);font-weight:800}
  .invsum{background:var(--coral-bg);border:1px solid #f1cbb9;border-radius:12px;padding:10px 14px;margin:2px 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .invsum .lb{font-size:12.5px;font-weight:800;color:#8a3b1c}
  .invsum .amt{font-size:21px;font-weight:800;color:var(--coral);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .invsum .note{font-size:10.5px;color:var(--sub);font-weight:700;width:100%}
  .row{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
    padding:8px 11px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
  .row.lead-red{border-left:4px solid var(--red)}
  .row.lead-amber{border-left:4px solid var(--amber)}
  .row.lead-blue{border-left:4px solid var(--blue)}
  .row.lead-green{border-left:4px solid var(--green)}
  .thumb{grid-row:1 / span 2;width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--gray-bg);border:1px solid var(--line);cursor:zoom-in}
  .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--sub);cursor:default}
  .name{font-size:14px;font-weight:700;letter-spacing:.01em;min-width:0;line-height:1.3}
  .name.tap{cursor:pointer}
  .chev{color:var(--sub);font-weight:700;margin-left:5px;font-size:15px}
  .cart{margin-left:6px;text-decoration:none;font-size:14px}
  .meta{font-size:11px;color:var(--sub);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{background:var(--gray-bg);color:var(--sub);border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
  .exp{border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
  .exp.warn{background:var(--coral-bg);color:var(--coral)}
  .exp.soon{background:var(--amber-bg);color:var(--amber)}
  .note{justify-self:end;text-align:right;min-width:92px}
  .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .badge.red{background:var(--coral-bg);color:var(--red)}
  .badge.amber{background:var(--amber-bg);color:var(--amber)}
  .badge.blue{background:var(--blue-bg);color:var(--blue)}
  .badge.green{background:var(--green-bg);color:var(--green)}
  .nsub{font-size:11px;color:var(--sub);margin-top:2px}

  .barwrap{grid-column:2 / -1;margin-top:6px}
  .track{position:relative;height:16px;background:var(--track);border:1px solid var(--track-br);border-radius:6px;overflow:hidden}
  .fill{position:absolute;top:0;left:0;height:100%;border-radius:6px 0 0 6px}
  .fill.store{z-index:2}
  .fill.ware{z-index:1;background:repeating-linear-gradient(45deg,rgba(120,110,95,.22),rgba(120,110,95,.22) 5px,rgba(120,110,95,.11) 5px,rgba(120,110,95,.11) 10px)}
  .fill.red{background:var(--coral)} .fill.green{background:var(--green)} .fill.amber{background:var(--amber)}
  .minmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);z-index:3}
  .minmark:after{content:"最低";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--ink);white-space:nowrap}

  .edit{grid-column:1 / -1;margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .stepper{display:flex;align-items:center;gap:4px;flex:none}
  .stepper .lbl{font-size:11.5px;color:var(--sub);font-weight:700;min-width:22px}
  .stepper .val{font-size:14px;font-weight:800;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
  .btn{width:27px;height:27px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;user-select:none;line-height:1;box-shadow:var(--shadow)}
  .btn:active{transform:scale(.92);background:var(--gray-bg)}
  .minlbl{font-size:11.5px;color:var(--sub);font-weight:700;flex:none;white-space:nowrap}
  .minlbl b{color:var(--ink);font-weight:800}
  .obtn{border:1px solid var(--line);background:var(--card);color:var(--coral);font-size:12px;font-weight:800;border-radius:999px;padding:7px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow);white-space:nowrap}
  .obtn:active{transform:scale(.95);background:var(--coral-bg)}
  .obtn.order{color:#fff;background:var(--coral);border-color:var(--coral)}
  .obtn.recv{color:#fff;background:var(--green);border-color:var(--green)}
  .obtn.order:active,.obtn.recv:active{filter:brightness(.92);background:var(--coral)}
  .sup-tag{background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
  /* 毎日チェックのチェックリスト */
  .crow{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:10px 13px}
  .crow.lead-red{border-left:4px solid var(--red)} .crow.lead-amber{border-left:4px solid var(--amber)}
  .crow.lead-blue{border-left:4px solid var(--blue)} .crow.lead-green{border-left:4px solid var(--green)}
  .crow .chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .crow .note{text-align:right;min-width:88px}
  .donebtn{border:none;border-radius:999px;background:var(--green);color:#fff;font-size:13px;font-weight:800;padding:8px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-left:auto;white-space:nowrap}
  .donebtn:active{transform:scale(.96)}
  .donebtn.undo{background:var(--card);color:var(--sub);border:1px solid var(--line)}
  .crow.done{background:var(--gray-bg)}
  .crow.done .cname{text-decoration:line-through;color:var(--sub)}
  .crow.done .meta,.crow.done .note{opacity:.55}
  .crow.done .edit .btn{pointer-events:none;opacity:.38}
  .crow.done .edit .stepper .val,.crow.done .edit .minlbl{color:var(--sub)}
  /* 当日の完了カウンター */
  .chkprog{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:11px 14px;margin:2px 0 9px}
  .chkprog .cptop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .chkprog .cplb{font-size:12.5px;font-weight:800;color:var(--ink)}
  .chkprog .cpnum{font-size:16px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
  .chkprog .cpbar{height:9px;background:var(--track);border:1px solid var(--track-br);border-radius:6px;overflow:hidden}
  .chkprog .cpfill{height:100%;background:var(--green);border-radius:5px;transition:width .25s}
  .chkprog .cpsub{display:flex;gap:8px;align-items:center;margin-top:10px}
  .chknm{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--ink);outline:none}
  .chknm::placeholder{color:var(--sub)}
  .subbtn{border:none;border-radius:10px;background:var(--coral);color:#fff;font-size:14px;font-weight:800;padding:9px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  .subbtn:active{transform:scale(.96)} .subbtn.busy{opacity:.5;pointer-events:none}
  .histbtn{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:13px;font-weight:800;padding:9px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  /* 提出履歴 */
  .histlist{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .hcard{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--card)}
  .hcard .hhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .hcard .hdt{font-size:12.5px;color:var(--sub);font-weight:700}
  .hcard .hdn{font-size:14px;font-weight:800;color:var(--amber)} .hcard .hdn.ok{color:var(--green)}
  .hcard .hmeta{font-size:14px;font-weight:800;margin-top:3px;display:flex;align-items:center;gap:8px}
  .hcard .hsc{font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:1px 8px}
  .hcard .hund{font-size:12px;color:#8a5a00;background:var(--amber-bg);border-radius:8px;padding:6px 9px;margin-top:6px;line-height:1.5}
  .hcard .hund.alldone{color:var(--green);background:var(--green-bg)}

  /* 棚卸の行 */
  .srow{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 13px}
  .srow .shd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .srow .snm{font-size:14.5px;font-weight:700;min-width:0}
  .srow .smeta{font-size:11px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .srow .sedit{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px}
  .srow .sk{font-size:11.5px;color:var(--sub);font-weight:700}
  .sin{width:74px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:14px;font-weight:800;color:var(--ink);background:var(--card)}
  .sin.wide{width:120px;font-weight:600;text-align:left}
  .sdiff{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px}
  .sdiff.ok{background:var(--green-bg);color:var(--green)} .sdiff.loss{background:var(--coral-bg);color:var(--red)} .sdiff.over{background:var(--amber-bg);color:var(--amber)} .sdiff.none{background:var(--gray-bg);color:var(--sub)}

  footer{margin-top:20px;text-align:center;color:var(--sub);font-size:12px;line-height:1.7}
  footer a{color:var(--coral);text-decoration:none;font-weight:700}
  .empty{text-align:center;color:var(--sub);padding:46px 16px;font-size:14px;line-height:1.8}

  .banner{background:var(--amber-bg);color:#8a5a00;border:1px solid #f0d9a0;border-radius:11px;
    padding:9px 13px;font-size:12.5px;font-weight:700;margin:0 0 12px;display:none}
  .banner.show{display:block}

  /* 下部固定タブ */
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;z-index:45;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(60,40,20,.06)}
  .navbtn{flex:1;background:none;border:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:800;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .navbtn .ic{position:relative;display:flex;align-items:center;justify-content:center;line-height:1}
  .navbtn .ic svg{width:25px;height:25px;display:block}
  .navbadge{position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:800;border:2px solid var(--card);padding:0 2px;box-sizing:content-box}
  .navbtn.on{color:var(--coral)}
  .navbtn.off{opacity:.36;pointer-events:none}

  .fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
    background:var(--coral);color:#fff;border:none;font-size:29px;font-weight:300;line-height:1;box-shadow:0 6px 18px rgba(216,85,44,.4);
    cursor:pointer;z-index:44;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .fab.hide{display:none}
  .fab:active{transform:scale(.94)}

  .modal{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
  @media(min-width:560px){ .modal{align-items:center} .sheet{border-radius:18px} }
  .shead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .shead .thumb{width:54px;height:54px}
  .shead .nm{font-size:17px;font-weight:800;flex:1;min-width:0}
  .shead .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;flex:none}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .frow .k{font-size:12.5px;color:var(--sub);font-weight:700;flex:none}
  .frow .v{font-size:14px;font-weight:700;text-align:right;min-width:0;word-break:break-word}
  .frow .v a{color:var(--coral);text-decoration:none;font-weight:800}
  .ed{display:flex;align-items:center;gap:7px}
  .ed input{width:70px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .ed input.txt{width:150px;text-align:left;font-weight:600}
  .selr{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;font-size:14px;font-weight:700;color:var(--ink);outline:none;max-width:190px}
  .frow .idv{font-size:13px;color:var(--sub);font-weight:700}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 4px}
  .pbtn{flex:1;min-width:120px;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .pbtn.p{background:var(--coral);color:#fff} .pbtn.g{background:var(--green);color:#fff}
  .pbtn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .pbtn.del{background:var(--card);color:var(--red);border:1px solid var(--red)}
  .pbtn:active{transform:scale(.98)} .pbtn.busy{opacity:.5;pointer-events:none}
  .rin{flex:1;min-width:100px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:14px;font-weight:700;text-align:center;color:var(--ink)}
  .hist{margin-top:6px}
  .hist .h{font-size:12.5px;color:var(--sub);font-weight:800;margin:12px 0 4px}
  .hist .hr{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 2px;border-bottom:1px dashed var(--line);color:var(--ink)}
  .hist .hr .kd{font-weight:800}
  .frm label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 3px}
  .frm input,.frm select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-size:14px;color:var(--ink);outline:none}
  .addimg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
  .addimg img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .addimg .pbtn{flex:1}
  .ordtag{background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:1px 7px;font-weight:800;font-size:11px}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:70;max-width:88%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 写真の拡大ポップアップ */
  .lbox{position:fixed;inset:0;background:rgba(28,20,14,.84);z-index:80;display:none;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .2s ease;cursor:zoom-out;-webkit-tap-highlight-color:transparent}
  .lbox img{max-width:90vw;max-height:84vh;border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.55);transform:scale(.3);opacity:.2;transition:transform .3s cubic-bezier(.2,1.3,.4,1),opacity .22s ease}
  .lbox.in{opacity:1}
  .lbox.in img{transform:scale(1);opacity:1}
  .lbox.q img{transition:transform .2s cubic-bezier(.4,0,1,1),opacity .18s ease}

  @media (max-width:560px){
    .hero{grid-template-columns:repeat(4,1fr);gap:5px}
    .kpi{padding:7px 4px}
    .kpi .n{font-size:19px}
    .kpi .lb{font-size:9.5px}
    .note{min-width:84px}
    .search{margin-left:0;max-width:none}
  }

  /* ===== アニメーション（演出） ===== */
  @keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes popIn{0%{opacity:0;transform:translateY(10px) scale(.9)}60%{transform:translateY(0) scale(1.04)}100%{opacity:1;transform:scale(1)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(44px);opacity:.3}to{transform:translateY(0);opacity:1}}
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes fabIn{0%{opacity:0;transform:scale(.3) rotate(-100deg)}70%{transform:scale(1.12) rotate(8deg)}100%{opacity:1;transform:none}}
  @keyframes navPop{0%,100%{transform:translateY(0) scale(1)}42%{transform:translateY(-4px) scale(1.14)}}
  @keyframes donePop{0%{transform:scale(1)}28%{transform:scale(.965)}100%{transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 4px #fbe4d8}50%{box-shadow:0 0 0 7px #f6cebb}}

  /* 入場演出（ユーザー操作時のみ .animin を付与） */
  .animin{animation:riseIn .42s cubic-bezier(.22,.9,.3,1) both}
  .kpi.animin{animation:popIn .5s cubic-bezier(.22,1.08,.3,1) both}
  .invsum.animin,.chkprog.animin{animation:riseIn .46s cubic-bezier(.22,.9,.3,1) both}
  /* バーは0から伸びる */
  .fill{transform-origin:left center}
  .row.animin .fill{animation:growX .6s cubic-bezier(.2,.8,.2,1) both}
  .chkprog .cpfill{transform-origin:left center}
  /* タイトルのドットがゆっくり鼓動 */
  .ttl .dot{animation:pulseDot 2.4s ease-in-out infinite}
  /* タブ切替でナビのアイコンが弾む */
  .navbtn.bounce .ic{animation:navPop .44s cubic-bezier(.3,1.3,.4,1)}
  /* 完了チェックの余韻 */
  .crow{transition:background .3s ease,opacity .3s ease}
  .crow.justdone{animation:donePop .45s ease}
  .cpnum.bump{animation:popIn .42s ease}
  /* FAB 登場 */
  .fab{animation:fabIn .5s cubic-bezier(.2,1.1,.3,1) both}
  /* モーダル：背景フェード＋シートがせり上がる */
  .modal.show{animation:fadeIn .22s ease}
  .modal.show .sheet{animation:slideUp .34s cubic-bezier(.2,.9,.25,1)}
  /* 読み込み中スピナー */
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <header class="top">
      <div class="ttl"><span class="dot"></span>どら山在庫リスト</div>
      <div class="updated">最終更新 <b id="upd">—</b></div>
    </header>

    <div class="hero" id="hero"></div>

    <div class="banner" id="banner">＋/− での在庫の変更は、いまは準備中です（Macで1回の承認後に保存できるようになります）。</div>

    <div class="controls" id="controls">
      <div class="chips" id="chips"></div>
      <div class="selwrap" id="supwrap"><label>発注先</label><select class="sel" id="supsel"></select></div>
      <div class="search"><input id="q" type="search" placeholder="品名でさがす" autocomplete="off"></div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <footer id="foot">
    数字は <b>店舗在庫</b> と <b>最低ライン</b>、斜線は倉庫の予備。品名をタップで詳細・発注・編集。到着待ちは発送メールから自動反映。
  </footer>
</div>

<button class="fab" id="fab" title="商品を追加">＋</button>

<nav class="nav" id="nav">
  <button class="navbtn" data-tab="要発注"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 10.2v3.1c0 1.7.8 2.8 1.9 3.8H4.6c1.1-1 1.9-2.1 1.9-3.8v-3.1a5.5 5.5 0 0 1 9-4.2"/><path d="M10 20h4"/><circle cx="18.4" cy="5.3" r="2.3" fill="currentColor" stroke="none"/></svg><span class="navbadge" id="nbadge" style="display:none">0</span></span>要発注リスト</button>
  <button class="navbtn" data-tab="毎日"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.7"/><path d="M7.6 2.9v3.2M16.4 2.9v3.2M3.5 9.2h17"/><path d="m8.3 15 2.7 2.5 4.8-5"/></svg></span>チェックリスト</button>
  <button class="navbtn" data-tab="商品"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2.7 8.2 4.5v9.4L12 21.2l-8.2-4.6V7.2L12 2.7Z"/><path d="m3.8 7.2 8.2 4.6 8.2-4.6M12 11.8v9.4M8 4.9l8.3 4.5v3.3"/></svg></span>商品一覧</button>
</nav>

<div class="modal" id="detail"><div class="sheet" id="detailBody"></div></div>
<div class="modal" id="addm"><div class="sheet" id="addBody"></div></div>
<div class="modal" id="histm"><div class="sheet" id="histBody"></div></div>
<input type="file" id="imgfile" accept="image/*" style="display:none" onchange="onImgPick(this)">
<input type="file" id="a_imgfile" accept="image/*" style="display:none" onchange="onAddImgPick(this)">
<div class="lbox" id="lbox" onclick="closePhoto()"><img id="lboxImg" src="" alt="商品写真"></div>
<div id="toast"></div>

<script>
var TOKEN = "dorayama-zaiko-2026";
var STATE = { tab:"要発注", cat:"すべて", sup:"すべて", group:null, q:"" };
var DATA = null, GAS_URL = "", IMG_BY_ID = {}, PRICE_BY_ID = {}, CHECKED = {}, LAST_ACT = 0, OPEN_ID = null, PENDING_ADD_IMG = "";
var ANIM_SIG = null, ANIM_LASTTAB = null;
// 数字のカウントアップ演出
function countUp(el, to, dur, delay, yen){
  to=Number(to)||0; dur=dur||520; delay=delay||0; var st=null;
  function step(ts){ if(st===null)st=ts; var p=Math.min(1,(ts-st)/dur); var e=1-Math.pow(1-p,3);
    var v=Math.round(to*e); el.textContent=yen?('¥'+fmt(v)):v; if(p<1) requestAnimationFrame(step);
    else el.textContent=yen?('¥'+fmt(to)):to; }
  setTimeout(function(){ requestAnimationFrame(step); }, delay);
}
function animEl(el,i){ el.classList.add('animin'); el.style.animationDelay=(Math.min(i,16)*0.035)+'s'; }

function fmt(n){ if(n==null) return "—"; n=Math.round(n*10)/10; return (""+n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function esc(s){ return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show';
  clearTimeout(window._tt); window._tt=setTimeout(function(){ t.className=''; }, 2600); }
function openPhoto(src){ if(!src) return; var b=document.getElementById('lbox'),im=document.getElementById('lboxImg');
  clearTimeout(window._lb); im.src=src; b.className='lbox'; b.style.display='flex'; void b.offsetWidth; b.className='lbox in'; }
function closePhoto(){ var b=document.getElementById('lbox'),im=document.getElementById('lboxImg');
  b.className='lbox q'; window._lb=setTimeout(function(){ b.style.display='none'; b.className='lbox'; im.src=''; }, 240); }
function mdstr(iso){ var m=(""+iso).match(/\d{4}-(\d{2})-(\d{2})/); return m?((+m[1])+"/"+(+m[2])):iso; }

function classify(it){
  var s=it.s, w=it.w, mn=it.min, total=it.total, ship=it.ship;
  var hasW=(w>=0.5), belowShelf=(mn!=null&&s<mn), shortTotal=(mn!=null&&total<mn);
  var barCls = belowShelf ? "red" : "green";
  if(it.ordered) return {pri:3,badge:"発注済み",badgeCls:"blue",sub:(it.oeta?("納品予定 "+mdstr(it.oeta)):"発注済み"),lead:"lead-blue",barCls:barCls,gk:"到着待ち"};
  if(ship) return {pri:3,badge:"到着待ち",badgeCls:"blue",sub:(it.eta?("お届け "+it.eta+"頃"):it.ship),lead:"lead-blue",barCls:barCls,gk:"到着待ち"};
  if(shortTotal) return {pri:0,badge:"発注を検討",badgeCls:"red",sub:"在庫 "+fmt(total)+" / 最低 "+fmt(mn)+(hasW?"（倉庫に "+fmt(w)+"）":""),lead:"lead-red",barCls:"red",gk:"今すぐ発注"};
  if(mn!=null&&total===mn) return {pri:4,badge:"在庫わずか",badgeCls:"amber",sub:"最低ラインぴったり",lead:"lead-amber",barCls:"amber",gk:"在庫わずか"};
  if(belowShelf&&hasW) return {pri:5,badge:"倉庫から補充",badgeCls:"amber",sub:"倉庫に "+fmt(w)+" あり",lead:"lead-amber",barCls:"red",gk:"十分"};
  if(mn==null) return {pri:7,badge:"目安なし",badgeCls:"green",sub:"最低在庫 未設定",lead:"lead-green",barCls:"green",gk:"十分"};
  return {pri:6,badge:"在庫OK",badgeCls:"green",sub:"",lead:"lead-green",barCls:"green",gk:"十分"};
}
function parseDate(s){ s=(""+s).trim(); if(!s) return null;
  var m=s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})/); if(m){var y=new Date().getFullYear();return new Date(y,+m[1]-1,+m[2]);} return null; }
function md(d){return (d.getMonth()+1)+"/"+d.getDate();}
function expInfo(it){
  if(!it.exp) return null; var d=parseDate(it.exp); if(!d) return null;
  var today=new Date(); today.setHours(0,0,0,0); var diff=Math.round((d-today)/86400000);
  if(diff<0) return {cls:"warn",txt:"⚠️期限切れ "+md(d)}; if(diff<=7) return {cls:"soon",txt:"⏰期限 "+md(d)}; return {cls:"",txt:"期限 "+md(d)}; }

var HERO=[{key:"今すぐ発注",cls:"c-red"},{key:"到着待ち",cls:"c-blue"},{key:"在庫わずか",cls:"c-amber"},{key:"十分",cls:"c-green"}];

function itemById(id){ for(var i=0;i<DATA.items.length;i++){ if(String(DATA.items[i].id)===String(id)) return DATA.items[i]; } return null; }
function phThumb(cat){ var d=document.createElement('div'); d.className='thumb ph'; d.textContent=(cat||'').slice(0,2); return d; }
function isUrl(s){ return /^https?:\/\//i.test((""+(s||"")).trim()); }

function render(){
  if(!DATA){ return; }
  var tab=STATE.tab;
  // 入場演出：絞り込み/タブ等が変わったユーザー操作のときだけ再生（自動更新や完了トグルでは再生しない）
  var _sig=tab+"|"+STATE.cat+"|"+STATE.sup+"|"+STATE.group;
  var doAnim=(_sig!==ANIM_SIG); var tabChanged=(tab!==ANIM_LASTTAB);
  ANIM_SIG=_sig; ANIM_LASTTAB=tab;
  // 下部タブの選択状態
  var nb=document.getElementById('nav').children;
  for(var i=0;i<nb.length;i++){ var t=nb[i]; var isOff=t.className.indexOf('off')>=0;
    t.className="navbtn"+(isOff?" off":"")+(t.getAttribute('data-tab')===tab?(" on"+(tabChanged?" bounce":"")):""); }
  // 要発注タブの通知バッジ（今すぐ発注の件数）
  var urgent=0; DATA.items.forEach(function(it){ if(classify(it).gk==="今すぐ発注") urgent++; });
  var nbd=document.getElementById('nbadge');
  if(nbd){ if(urgent>0){ nbd.textContent=urgent; nbd.style.display=""; } else { nbd.style.display="none"; } }

  // コントロールの出し分け
  var showHero=(tab==="要発注");
  var showChips=(tab==="商品"||tab==="毎日");
  var showSup=(tab==="要発注"||tab==="商品"||tab==="毎日");
  var showControls=true;
  var showSearch=true;
  document.getElementById('hero').className="hero"+(showHero?"":" hide");
  document.getElementById('controls').className="controls"+(showControls?"":" hide");
  document.getElementById('chips').className="chips"+(showChips?"":" hide");
  document.getElementById('supwrap').className="selwrap"+(showSup?"":" hide");
  document.querySelector('.search').style.display=showSearch?"":"none";
  document.getElementById('fab').className="fab"+((tab==="毎日")?" hide":"");
  document.getElementById('foot').style.display=(tab==="要発注"||tab==="商品")?"":"none";

  var list=document.getElementById('list');

  // 集計カード（要発注タブ）
  var items = DATA.items.map(function(it){ return {it:it,c:classify(it)}; });
  if(showHero){
    var counts={}; HERO.forEach(function(h){counts[h.key]=0;});
    items.forEach(function(x){ counts[x.c.gk]=(counts[x.c.gk]||0)+1; });
    var hero=document.getElementById('hero'); hero.innerHTML="";
    HERO.forEach(function(h,hi){
      var el=document.createElement('button');
      var cnt=counts[h.key]||0;
      el.className="kpi "+h.cls+(STATE.group===h.key?" on":"")+(doAnim?" animin":"");
      if(doAnim) el.style.animationDelay=(hi*0.05)+'s';
      el.innerHTML='<div class="n">'+(doAnim?0:cnt)+'</div><div class="lb">'+h.key+'</div><div class="bar"></div>';
      el.onclick=function(){ STATE.group=(STATE.group===h.key?null:h.key); render(); };
      hero.appendChild(el);
      if(doAnim) countUp(el.querySelector('.n'), cnt, 560, 120+hi*60);
    });
  }

  // カテゴリーチップ（商品/棚卸）
  if(showChips){
    var cats=["すべて"]; DATA.items.forEach(function(it){ if(cats.indexOf(it.cat)<0) cats.push(it.cat); });
    var chips=document.getElementById('chips'); chips.innerHTML="";
    cats.forEach(function(c){ var el=document.createElement('button');
      el.className="chip"+(STATE.cat===c?" on":""); el.textContent=c;
      el.onclick=function(){ STATE.cat=c; render(); }; chips.appendChild(el); });
  }
  // 発注先セレクト（要発注/商品）
  if(showSup){
    var sups=["すべて"]; DATA.items.forEach(function(it){ if(it.sup && sups.indexOf(it.sup)<0) sups.push(it.sup); });
    var sel=document.getElementById('supsel');
    if(sel){ sel.innerHTML="";
      sups.forEach(function(sp){ var o=document.createElement('option'); o.value=sp; o.textContent=sp; if(sp===STATE.sup)o.selected=true; sel.appendChild(o); });
      sel.onchange=function(){ STATE.sup=sel.value; render(); }; }
  }

  var q=STATE.q.trim();
  var rows=items.filter(function(x){
    if(q && x.it.name.indexOf(q)<0) return false;
    if(showSup && STATE.sup!=="すべて" && x.it.sup!==STATE.sup) return false;
    if(showChips && STATE.cat!=="すべて" && x.it.cat!==STATE.cat) return false;
    if(tab==="毎日" && !freqDueToday(x.it.freq)) return false;   // チェックリスト＝今日に確認する頻度の品だけ（曜日自動判定）
    if(tab==="要発注"){
      if(STATE.group) return x.c.gk===STATE.group;
      return x.c.gk!=="十分";               // 要発注リスト＝対応が要る品だけ
    }
    return true;
  });

  // 並び・グループ
  var groupKey=null;   // null＝グループ無し（毎日チェックは全品フラット・並び順そのまま）
  if(tab==="要発注"){ groupKey=function(x){ return x.c.gk==="到着待ち"?"発注済み":"未発注"; };
    rows.sort(function(a,b){ var ga=(a.c.gk==="到着待ち")?1:0, gb=(b.c.gk==="到着待ち")?1:0; if(ga!==gb)return ga-gb; return a.c.pri-b.c.pri; }); }
  else if(tab==="毎日"){ var FO={"毎日":0,"月・水・金":1,"週一(日)":2};   // 発注確認頻度でグループ分け
    groupKey=function(x){ return String(x.it.freq||"").trim()||"その他"; };
    rows.sort(function(a,b){ var fa=FO[String(a.it.freq||"").trim()], fb=FO[String(b.it.freq||"").trim()]; if(fa==null)fa=9; if(fb==null)fb=9; if(fa!==fb)return fa-fb; return a.c.pri-b.c.pri; }); }
  else if(tab==="商品"){ groupKey=function(x){ return x.it.cat; };   // カテゴリー順
    rows.sort(function(a,b){ if(a.it.cat!==b.it.cat)return a.it.cat<b.it.cat?-1:1; return a.it.name<b.it.name?-1:1; }); }

  list.innerHTML="";
  if(!rows.length){ list.innerHTML='<div class="empty">該当する品目はありません</div>'; return; }
  if(tab==="毎日"){
    var dnAll=rows.filter(function(x){return chkIs(x.it.id);}).length, totAll=rows.length;
    var pctAll=totAll?Math.round(dnAll/totAll*100):0;
    var cp=document.createElement('div'); cp.className="chkprog"+(doAnim?" animin":"");
    cp.innerHTML='<div class="cptop"><span class="cplb">今日の確認</span><span class="cpnum">'+dnAll+' / '+totAll+' 完了</span></div>'+
      '<div class="cpbar"><div class="cpfill" style="width:'+pctAll+'%"></div></div>'+
      '<div class="cpsub"><input id="chkname" class="chknm" type="text" inputmode="text" placeholder="確認者の名前" value="'+esc(getChkName())+'" oninput="setChkName(this.value)">'+
        '<button class="subbtn" onclick="submitCheck()">提出</button>'+
        '<button class="histbtn" onclick="openHist()">履歴</button></div>';
    list.appendChild(cp);
  }
  if(tab==="商品"){
    var invTot=0, priced=0;
    rows.forEach(function(x){ if(x.it.price!=null && x.it.price!==""){ invTot += (x.it.w+x.it.s)*Number(x.it.price); priced++; } });
    var allView=(STATE.cat==="すべて" && STATE.sup==="すべて" && !STATE.q.trim());
    var sum=document.createElement('div'); sum.className="invsum"+(doAnim?" animin":"");
    sum.innerHTML='<span class="lb">商品棚卸高（在庫評価額）</span><span class="amt">¥'+(doAnim?'0':fmt(Math.round(invTot)))+'</span>'+
      '<span class="note">'+(allView?'全商品':'絞り込み')+'の合計　単価設定済み '+priced+' / '+rows.length+' 品（未設定は計算対象外）</span>';
    list.appendChild(sum);
    if(doAnim) countUp(sum.querySelector('.amt'), Math.round(invTot), 720, 160, true);
  }
  var lastGrp=null, ai=0;
  rows.forEach(function(x){
    if(groupKey){ var gk=groupKey(x);
      if(gk!==lastGrp){ lastGrp=gk;
        var cnt=rows.filter(function(y){ return groupKey(y)===gk; }).length;
        var g=document.createElement('div'); g.className="grp";
        var cntHtml=''+cnt;
        if(tab==="毎日"){ var dn=rows.filter(function(y){ return groupKey(y)===gk && chkIs(y.it.id); }).length; cntHtml=dn+' / '+cnt; }
        g.innerHTML='<span>'+esc(gk)+'</span><span class="cnt">'+cntHtml+'</span><span class="ln"></span>';
        if(doAnim) animEl(g, ai++);
        list.appendChild(g);
      }
    }
    var _rel=(tab==="毎日" ? chkRowEl(x.it,x.c) : rowEl(x.it,x.c));
    if(doAnim) animEl(_rel, ai++);
    list.appendChild(_rel);
  });
}

// 今日に確認すべき発注確認頻度か（曜日で自動判定）。毎日=常に／月・水・金=月水金／週一(日)=日曜。
function freqDueToday(f){ f=String(f||"").trim(); if(f==="毎日") return true;
  var d=new Date().getDay();   // 0=日 1=月 2=火 3=水 4=木 5=金 6=土
  if(f==="月・水・金") return (d===1||d===3||d===5);
  if(f==="週一(日)") return (d===0);
  return false; }
// チェックリスト＝発注確認頻度ごとのチェックリスト。✓は当日ぶんをこの端末に保存し翌日リセット。
// 完了状態は全端末で共有（GASの「チェック状態」シート・当日ぶん）。CHECKEDは読み込み時に同期。
function chkIs(id){ return !!CHECKED[String(id)]; }
function chkToggle(id){ id=String(id); LAST_ACT=Date.now();
  if(!GAS_URL){ toast('保存はMacで1回承認後に有効になります'); return; }
  var on=!CHECKED[id]; if(on) CHECKED[id]=1; else delete CHECKED[id];
  var y=window.scrollY||window.pageYOffset||0; render(); window.scrollTo(0,y);
  if(on){ var _r=document.querySelector('.crow[data-id="'+id+'"]'); if(_r) _r.classList.add('justdone'); }
  var _cn=document.querySelector('.cpnum'); if(_cn){ _cn.classList.remove('bump'); void _cn.offsetWidth; _cn.classList.add('bump'); }
  gasJsonp({action:'chkset',id:id,on:on?1:0,name:(getChkName()||'')},function(resp){ if(!(resp&&resp.ok)) toast('同期に失敗しました（通信をご確認ください）'); }); }
function chkRowEl(it,c){
  var done=chkIs(it.id);

               : '<button class="donebtn" onclick="chkToggle(\''+it.id+'\')">✓ 完了</button>';
  var thumb = it.img
    ? '<img class="thumb cthumb" src="'+it.img+'" loading="lazy" alt="" data-cat="'+esc(it.cat)+'" onclick="event.stopPropagation();openPhoto(this.src)" onerror="this.replaceWith(phThumb(this.getAttribute(\'data-cat\')))">'
    : '<div class="thumb ph cthumb">'+esc((it.cat||"").slice(0,2))+'</div>';

}
function getChkName(){ try{ return localStorage.getItem('chkname')||''; }catch(e){ return ''; } }
function setChkName(v){ try{ localStorage.setItem('chkname', v||''); }catch(e){} }
function dueItems(){ return (DATA&&DATA.items)?DATA.items.filter(function(it){ return freqDueToday(it.freq); }):[]; }
function submitCheck(){
  var name=(getChkName()||'').trim();
  if(!name){ toast('確認者の名前を入れてください'); var el=document.getElementById('chkname'); if(el)el.focus(); return; }
  if(!GAS_URL){ toast('保存はMacで1回承認後に有効になります'); return; }
  var due=dueItems(), done=0, undone=[];
  due.forEach(function(it){ if(chkIs(it.id)) done++; else undone.push(it.name); });
  var wd=['日','月','火','水','木','金','土'][new Date().getDay()];
  var sc=[]; ['毎日','月・水・金','週一(日)'].forEach(function(f){ if(due.some(function(it){return String(it.freq||'').trim()===f;})) sc.push(f); });
  var btn=document.querySelector('.subbtn'); if(btn){ btn.textContent='送信中…'; btn.className='subbtn busy'; }
  gasJsonp({action:'submitcheck',name:name,weekday:wd,scope:sc.join('・'),done:done,total:due.length,undone:undone.join('、')},function(resp){
    if(btn){ btn.textContent='提出'; btn.className='subbtn'; }
    if(resp&&resp.ok){ toast('提出しました（'+name+' ・ '+done+'/'+due.length+'件）'); }
    else toast(saveErr(resp));
  });
}
function openHist(){ var m=document.getElementById('histm'); m.className='modal show';
  document.getElementById('histBody').innerHTML='<div class="shead"><div class="nm">提出履歴</div><button class="x" onclick="closeHist()">✕</button></div><div class="empty">読み込み中…</div>';
  gasJsonp({action:'checkhist'},function(resp){ renderHist(resp&&resp.ok?resp.hist:null); }); }
function closeHist(){ document.getElementById('histm').className='modal'; }
function renderHist(hist){
  var h='<div class="shead"><div class="nm">提出履歴</div><button class="x" onclick="closeHist()">✕</button></div>';
  if(!hist||!hist.length){ h+='<div class="empty">まだ提出の記録はありません</div>'; document.getElementById('histBody').innerHTML=h; return; }
  h+='<div class="histlist">';
  hist.forEach(function(r){
    var ok=(String(r.done)===String(r.total));
    h+='<div class="hcard"><div class="hhd"><span class="hdt">'+esc(r.dt)+(r.wd?'（'+esc(r.wd)+'）':'')+'</span><span class="hdn '+(ok?"ok":"")+'">'+esc(r.done)+' / '+esc(r.total)+'</span></div>'+
       '<div class="hmeta"><b>'+esc(r.name)+'</b>'+(r.scope?'<span class="hsc">'+esc(r.scope)+'</span>':'')+'</div>'+
       (String(r.undone||'').trim()?'<div class="hund">未完了：'+esc(r.undone)+'</div>':'<div class="hund alldone">すべて完了</div>')+
       '</div>';
  });
  h+='</div>';
  document.getElementById('histBody').innerHTML=h;
}

function diffBadge(it){
  if(it.stk==null||it.stk==="") return '<span class="sdiff none">未カウント</span>';
  var d=Number(it.stk)-(it.total||0);
  if(d===0) return '<span class="sdiff ok">✓一致</span>';
  if(d<0) return '<span class="sdiff loss">▼ロス '+fmt(Math.abs(d))+'</span>';
  return '<span class="sdiff over">▲多い '+fmt(d)+'</span>';
}

function chg(id, field, delta, btn){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  var cur=(field==="w")?it.w:it.s;
  var nv=Math.max(0,(cur||0)+delta);
  if(field==="w") it.w=nv; else it.s=nv; it.total=it.w+it.s; refreshAll(id);
  gasJsonp({action:"inc",id:id,field:field,delta:delta},function(resp){
    if(resp&&resp.ok){ var real=Number(resp.value); if(field==="w") it.w=real; else it.s=real; it.total=it.w+it.s; }
    else { if(field==="w") it.w=cur; else it.s=cur; it.total=it.w+it.s; toast(saveErr(resp)); }
    refreshAll(id);
  });
}
function saveErr(resp){ return (resp&&resp.error==="auth")?"保存の承認がまだです（Macで1回）":((resp&&resp.error==="noURL")?"保存の受け口が未設定です":"保存できませんでした。通信をご確認ください"); }
function refreshAll(id){ render(); if(OPEN_ID===id) renderDetail(id); }
function fieldVal(it,f){ return f==="w"?it.w:(f==="s"?it.s:(f==="min"?it.min:(f==="lead"?it.lead:(f==="lot"?it.lot:(f==="stk"?it.stk:null))))); }
function applyField(it,f,v){ if(f==="w")it.w=v; else if(f==="s")it.s=v; else if(f==="min")it.min=v; else if(f==="lead")it.lead=v; else if(f==="lot")it.lot=v; else if(f==="stk")it.stk=v; it.total=(it.w||0)+(it.s||0); }

function gasJsonp(params, cb){
  if(!GAS_URL){ cb({ok:false,error:"noURL"}); return; }
  var name="jp"+(window._jc=(window._jc||0)+1);
  var done=false, s=document.createElement('script');
  window[name]=function(resp){ done=true; cleanup(); cb(resp); };
  function cleanup(){ try{delete window[name];}catch(e){window[name]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
  s.onerror=function(){ if(!done){ cleanup(); cb({ok:false,error:"neterr"}); } };
  var qs=[]; for(var k in params){ qs.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k])); }
  qs.push("token="+encodeURIComponent(TOKEN)); qs.push("callback="+name); qs.push("t="+Date.now());
  s.src=GAS_URL+"?"+qs.join("&");
  document.body.appendChild(s);
  setTimeout(function(){ if(!done){ cleanup(); cb({ok:false,error:"timeout"}); } }, 12000);
}

function setField(id,field,delta){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  var cur=fieldVal(it,field); var base=(cur==null||cur===""?0:Number(cur)); var nv=Math.max(0,base+delta);
  applyField(it,field,nv); refreshAll(id);
  gasJsonp({action:"set",id:id,field:field,value:nv},function(resp){
    if(resp&&resp.ok){ applyField(it,field,Number(resp.value)); }
    else { applyField(it,field,cur); toast(saveErr(resp)); }
    refreshAll(id);
  });
}
function setFieldAbs(id,field,valstr){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); refreshAll(id); return; }
  var str=String(valstr).replace(/,/g,"").trim();
  var nv=(str===""?0:Number(str));
  if(isNaN(nv)||nv<0){ refreshAll(id); return; }
  var cur=fieldVal(it,field);
  applyField(it,field,nv); refreshAll(id);
  gasJsonp({action:"set",id:id,field:field,value:nv},function(resp){
    if(!(resp&&resp.ok)){ applyField(it,field,cur); toast(saveErr(resp)); refreshAll(id); }
    else toast("保存しました");
  });
}
function setText(id,field,val){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  if(field==="name" && !(""+val).trim()){ toast("商品名は空にできません"); refreshAll(id); return; }
  var cur=it[field];
  it[field]=val; refreshAll(id);
  gasJsonp({action:"set",id:id,field:field,value:val},function(resp){
    if(!(resp&&resp.ok)){ it[field]=cur; toast(saveErr(resp)); refreshAll(id); }
    else toast("保存しました");
  });
}

function doOrder(id){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  it.ordered=true; refreshAll(id);
  gasJsonp({action:"order",id:id},function(resp){
    if(resp&&resp.ok){ it.ordered=!!resp.ordered; it.oeta=resp.oeta||""; toast("発注を記録しました"); reloadLive(); }
    else { it.ordered=false; toast(saveErr(resp)); }
    refreshAll(id);
  });
}
function doReceive(id){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  var el=document.getElementById('rqty'); var qty=el?(el.value||""):"";
  gasJsonp({action:"receive",id:id,qty:qty},function(resp){
    if(resp&&resp.ok){ it.ordered=false; it.oeta=""; if(resp.warehouse!=null){ it.w=Number(resp.warehouse); it.total=it.w+it.s; } toast("受領を記録しました"); reloadLive(); }
    else toast(saveErr(resp));
    refreshAll(id);
  });
}

function selRow(id,field,label,cur,opts){
  var o=opts.map(function(v){ var lb=(v===""?"（未設定）":v); return '<option value="'+esc(v)+'"'+(v===(cur||"")?" selected":"")+'>'+esc(lb)+'</option>'; }).join("");
  return '<div class="frow"><span class="k">'+label+'</span><span class="ed">'
    +'<select class="selr" onchange="setText(\''+id+'\',\''+field+'\',this.value)">'+o+'</select></span></div>';

function distinct(key,extra){
  var seen={}, out=[]; DATA.items.forEach(function(x){ var v=x[key]; if(v && !seen[v]){ seen[v]=1; out.push(v); } });
  (extra||[]).forEach(function(v){ if(out.indexOf(v)<0) out.push(v); });
  return out;
}
function refHtml(ref){
  if(!ref) return "—";
  if(isUrl(ref)) return '<a href="'+esc(ref)+'" target="_blank" rel="noopener">開く</a>';
  if(/^[\w.+-]+@[\w.-]+\.\w+$/.test(ref)) return '<a href="mailto:'+esc(ref)+'">'+esc(ref)+'</a>';
  var tel=ref.match(/0\d[\d\-]{7,}/);
  if(tel) return esc(ref).replace(esc(tel[0]),'<a href="tel:'+tel[0].replace(/-/g,'')+'">'+esc(tel[0])+'</a>');
  return esc(ref);
}
function histHtml(it){
  if(!it.hist||!it.hist.length) return '<div class="hist"><div class="h">発注履歴</div><div class="hr"><span>記録はありません</span><span></span></div></div>';
  var rows=it.hist.map(function(h){ var d=h.dt?(""+h.dt).replace(/\s.*$/,""):""; return '<div class="hr"><span>'+esc(d)+'</span><span class="kd">'+esc(h.kind)+(h.qty?(" "+esc(h.qty)):"")+'</span></div>'; }).join("");
  return '<div class="hist"><div class="h">発注履歴</div>'+rows+'</div>';
}

    +frow("在庫評価額", ((it.price!=null&&it.price!=="")?('¥'+fmt(Math.round((it.w+it.s)*Number(it.price)))+' <span style="color:var(--sub);font-weight:700">（'+fmt(it.total)+'×'+fmt(it.price)+'）</span>'):'<span style="color:var(--sub)">単価 未設定</span>'))
    +frow("発注ステータス", '<span class="badge '+c.badgeCls+'">'+c.badge+'</span> '+esc(ostatus))
    +frow("期限ステータス", (ex?'<span class="exp '+(ex.cls||"")+'">'+ex.txt+'</span>':'—'))
    +'<div class="acts">'+orderBtn+'</div>'
    +histHtml(it)
    +'<div class="acts" style="margin-top:18px"><button class="pbtn del" onclick="doDelete(\''+it.id+'\')">🗑 この商品を削除</button></div>';
}
function doDelete(id){
  var it=itemById(id); if(!it) return;
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  if(!window.confirm("「"+it.name+"」を一覧から削除します。よろしいですか？")) return;
  gasJsonp({action:"delete",id:id},function(resp){
    if(resp&&resp.ok){ toast("削除しました"); closeDetail(); reloadLive(); }
    else toast(saveErr(resp));
  });
}

function openAdd(){
  var set={}; DATA.items.forEach(function(it){ if(it.sup)set[it.sup]=1; }); var slist=Object.keys(set); if(slist.indexOf("その他")<0) slist.push("その他");
  var cset={}; DATA.items.forEach(function(it){ if(it.cat)cset[it.cat]=1; }); var clist=Object.keys(cset); if(clist.indexOf("未分類")<0) clist.push("未分類");
  function opts(arr,def){ return arr.map(function(a){ return '<option'+(a===def?" selected":"")+'>'+esc(a)+'</option>'; }).join(""); }
  var freqAddOpts=['','毎日','月・水・金','週一(日)'].map(function(f){ return '<option value="'+esc(f)+'">'+(f===''?'（未設定）':esc(f))+'</option>'; }).join("");
  PENDING_ADD_IMG="";
  document.getElementById('addBody').innerHTML=
     '<div class="shead"><div class="nm">商品を追加</div><button class="x" onclick="closeAdd()">✕</button></div>'
    +'<div class="frm">'
    +'<label>写真（任意）</label>'
    +'<div class="addimg"><img id="a_imgprev" alt="" style="display:none">'
    +'<button type="button" class="pbtn o" id="a_pick" onclick="pickAddImg()">📷 写真を選ぶ</button>'
    +'<button type="button" class="pbtn g" id="a_imgclr" onclick="clearAddImg()" style="display:none">取り消し</button></div>'
    +'<label>商品名 *</label><input id="a_name" type="text" autocomplete="off">'
    +'<label>カテゴリー</label><select id="a_cat">'+opts(clist,clist[0]||"未分類")+'</select>'
    +'<label>発注先</label><select id="a_sup">'+opts(slist,"その他")+'</select>'
    +'<label>発注確認頻度</label><select id="a_freq">'+freqAddOpts+'</select>'
    +'<label>倉庫数量</label><input id="a_w" type="number" inputmode="decimal" value="0">'
    +'<label>店舗在庫</label><input id="a_s" type="number" inputmode="decimal" value="0">'
    +'<label>最低在庫</label><input id="a_min" type="number" inputmode="decimal">'
    +'<label>納期日数</label><input id="a_lead" type="number" inputmode="decimal">'
    +'<label>発注ロット</label><input id="a_lot" type="number" inputmode="decimal">'
    +'<label>単価（円）</label><input id="a_price" type="number" inputmode="numeric" placeholder="例 5585">'
    +'<label>備考</label><input id="a_memo" type="text" autocomplete="off">'
    +'<label>参考URL・連絡先</label><input id="a_ref" type="text" autocomplete="off">'
    +'<label>賞味期限</label><input id="a_exp" type="text" placeholder="例 2026-11-30">'
    +'<label>ロット</label><input id="a_batch" type="text" autocomplete="off">'
    +'</div>'
    +'<div class="acts"><button class="pbtn p" id="a_save" onclick="submitAdd()">追加する</button></div>';
  document.getElementById('addm').className="modal show";
}
function closeAdd(){ PENDING_ADD_IMG=""; document.getElementById('addm').className="modal"; }
function submitAdd(){
  var name=(document.getElementById('a_name').value||"").trim();
  if(!name){ toast("商品名を入れてください"); return; }
  if(!GAS_URL){ toast("保存はMacで1回承認後に有効になります"); return; }
  var btn=document.getElementById('a_save'); btn.className="pbtn p busy";
  gasJsonp({action:"add",name:name,
    cat:document.getElementById('a_cat').value, sup:document.getElementById('a_sup').value,
    freq:document.getElementById('a_freq').value,
    w:document.getElementById('a_w').value, s:document.getElementById('a_s').value,
    min:document.getElementById('a_min').value, lead:document.getElementById('a_lead').value, lot:document.getElementById('a_lot').value,
    price:document.getElementById('a_price').value, memo:document.getElementById('a_memo').value,
    ref:document.getElementById('a_ref').value, exp:document.getElementById('a_exp').value, batch:document.getElementById('a_batch').value
  },function(resp){
    if(resp&&resp.ok){
      var pend=PENDING_ADD_IMG;
      closeAdd();
      if(pend){ uploadImg(resp.id,pend); toast("「"+resp.name+"」を追加しました。写真を保存中…"); }
      else { toast("「"+resp.name+"」を追加しました（"+resp.id+"）"); reloadLive(); }
    }
    else { btn.className="pbtn p"; toast(saveErr(resp)); }
  });
}

function reloadLive(){ if(!GAS_URL) return; gasLoad(function(live){ if(live&&live.items&&live.items.length){ applyData(live); if(OPEN_ID) renderDetail(OPEN_ID); } }); }
// 全端末同期：一定間隔で最新データを取り込む（操作中・画面を開いている間は見送り、スクロール位置は維持）
function anyModalOpen(){
  var ms=['detail','addm','histm'];
  for(var i=0;i<ms.length;i++){ var m=document.getElementById(ms[i]); if(m && String(m.className).indexOf('show')>=0) return true; }
  var lb=document.getElementById('lbox'); if(lb && lb.style.display==='flex') return true;
  return false;
}
function autoRefresh(){
  if(!GAS_URL || document.hidden) return;
  if(Date.now()-LAST_ACT < 7000) return;
  if(anyModalOpen()) return;
  var y=window.scrollY||window.pageYOffset||0;
  gasLoad(function(live){ if(live && live.items && live.items.length){ applyData(live); window.scrollTo(0,y); } });
}
// 端末の写真を選ぶ→縮小→アップロード→ドライブ保存→再読込で表示
function pickImg(id){ OPEN_ID=id; var f=document.getElementById('imgfile'); if(f){ f.value=''; f.click(); } }
// 画像ファイルを長辺900pxに縮小してJPEGのデータURLにする（詳細・新規追加で共用）
function resizeImg(file,cb){
  var rd=new FileReader();
  rd.onload=function(ev){ var im=new Image();
    im.onload=function(){ var mx=900, w=im.width, h=im.height;
      if(w>mx||h>mx){ if(w>=h){ h=Math.round(h*mx/w); w=mx; } else { w=Math.round(w*mx/h); h=mx; } }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h);
      var b64; try{ b64=cv.toDataURL('image/jpeg',0.82); }catch(e){ toast('画像を処理できませんでした'); return; }
      cb(b64); };
    im.onerror=function(){ toast('画像を読み込めませんでした'); };
    im.src=ev.target.result; };
  rd.onerror=function(){ toast('画像を読み込めませんでした'); };
  rd.readAsDataURL(file);
}
function onImgPick(inp){
  var file=inp.files&&inp.files[0]; if(!file) return;
  if(!GAS_URL){ toast('保存はMacで1回承認後に有効になります'); return; }
  var id=OPEN_ID;
  resizeImg(file,function(b64){ uploadImg(id,b64); });
}
// 新規追加フォーム：写真を選ぶ→縮小してプレビュー（送信は「追加する」で商品作成後にまとめて）
function pickAddImg(){ var f=document.getElementById('a_imgfile'); if(f){ f.value=''; f.click(); } }
function onAddImgPick(inp){
  var file=inp.files&&inp.files[0]; if(!file) return;
  resizeImg(file,function(b64){ PENDING_ADD_IMG=b64;
    var p=document.getElementById('a_imgprev'); if(p){ p.src=b64; p.style.display='inline-block'; }
    var c=document.getElementById('a_imgclr'); if(c) c.style.display='inline-block';
    var b=document.getElementById('a_pick'); if(b) b.textContent='📷 写真を変更';
  });
}
function clearAddImg(){ PENDING_ADD_IMG='';
  var f=document.getElementById('a_imgfile'); if(f) f.value='';
  var p=document.getElementById('a_imgprev'); if(p){ p.src=''; p.style.display='none'; }
  var c=document.getElementById('a_imgclr'); if(c) c.style.display='none';
  var b=document.getElementById('a_pick'); if(b) b.textContent='📷 写真を選ぶ';
}
function uploadImg(id,b64){
  toast('写真をアップロード中…');
  fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'img',id:id,token:TOKEN,data:b64})})
  .then(function(){ setTimeout(function(){ reloadLive(); toast('写真を更新しました'); }, 4500); })
  .catch(function(){ setTimeout(function(){ reloadLive(); toast('写真を更新しました'); }, 4500); });
}

function gasLoad(cb){
  if(!GAS_URL){ cb(null); return; }
  var name="jl"+(window._jl=(window._jl||0)+1);
  var done=false, s=document.createElement('script');
  window[name]=function(resp){ done=true; cleanup(); cb(resp&&resp.ok?resp:null); };
  function cleanup(){ try{delete window[name];}catch(e){window[name]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
  s.onerror=function(){ if(!done){ cleanup(); cb(null); } };
  s.src=GAS_URL+"?callback="+name+"&t="+Date.now();
  document.body.appendChild(s);
  setTimeout(function(){ if(!done){ cleanup(); cb(null); } }, 12000);
}

function applyData(d){
  if(d && d.items){ d.items.forEach(function(it){
    if(it.img){ IMG_BY_ID[it.id]=it.img; }
    else if(IMG_BY_ID[it.id]){ it.img=IMG_BY_ID[it.id]; }
    if(it.price!=null && it.price!==""){ PRICE_BY_ID[it.id]=Number(it.price); it.price=Number(it.price); }
    else if(PRICE_BY_ID[it.id]!=null){ it.price=PRICE_BY_ID[it.id]; }
  }); }
  if(d && d.checked){ CHECKED={}; d.checked.forEach(function(x){ CHECKED[String(x)]=1; }); }
  DATA=d; document.getElementById('upd').textContent=d.updated||""; render();
}

function boot(){
  document.addEventListener('pointerdown',function(){ LAST_ACT=Date.now(); }, true);
  document.addEventListener('input',function(){ LAST_ACT=Date.now(); }, true);
  setInterval(autoRefresh, 20000);   // 20秒ごとに全端末同期
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) autoRefresh(); });
  document.getElementById('q').addEventListener('input',function(e){STATE.q=e.target.value;render();});
  var nb=document.getElementById('nav').children;
  for(var i=0;i<nb.length;i++){ (function(t){ t.onclick=function(){ if(t.className.indexOf('off')>=0) return; STATE.tab=t.getAttribute('data-tab'); STATE.group=null; render(); }; })(nb[i]); }
  document.getElementById('fab').onclick=openAdd;
  ['detail','addm','histm'].forEach(function(mid){ var m=document.getElementById(mid);
    m.onclick=function(e){ if(e.target===m){ m.className="modal"; if(mid==='detail') OPEN_ID=null; } }; });

  fetch('gas_url.txt?t='+Date.now()).then(function(r){return r.ok?r.text():"";}).then(function(t){
    GAS_URL=(t||"").trim();
    document.getElementById('banner').className = GAS_URL ? "banner" : "banner show";
  }).catch(function(){}).finally(function(){
    fetch('data.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
      applyData(d);
      if(GAS_URL){ gasLoad(function(live){ if(live && live.items && live.items.length) applyData(live); }); }
    }).catch(function(){
      document.getElementById('list').innerHTML='<div class="empty">データを読み込めませんでした。<br>時間をおいて再読み込みしてください。</div>';
    });
  });
}
boot();
</script>
